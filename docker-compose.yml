name: janus-stack

networks:
  janus-net:
    driver: bridge

services:
  edge-gateway:
    image: caddy:2
    # The single same-origin front door — the ONLY port published to the host.
    ports:
      - "8080:8080"
    environment:
      # Site address = the per-environment TLS toggle (ADR-0002, Module 2). Local
      # is the port-only HTTP form; staging/prod inject a hostname instead, which
      # turns on Caddy's automatic HTTPS (and WSS) — same Caddyfile, only this value
      # changes. The published port below is this same 8080.
      GATEWAY_SITE_ADDRESS: ":8080"
      # Upstreams are injected per-environment; here they are compose service
      # names resolved on the internal network — the SAME Caddyfile, different
      # addresses (ADR-0002, Module 2). No second copy of the routing logic.
      DEMOGRAPHIC_UPSTREAM: "http://demographic-service:28001"
      CHARACTERISTIC_UPSTREAM: "http://characteristic-service:28002"
      REUSE_UPSTREAM: "http://reuse-service:28002"
      VOCAZIONE_UPSTREAM: "http://vocazione-service:28003"
      NOTIFICATIONS_UPSTREAM: "http://notification-service:28004"
      ROUND_UPSTREAM: "http://round-service:28005"
      MONOLITH_UPSTREAM: "http://ju-backend:8000"
      FRONTEND_UPSTREAM: "http://janus-dashboard-ui:3000"
    volumes:
      # Reuse the SAME Caddyfile every environment runs (the routing-contract
      # tests' file), mounted read-only — the routing map lives in one file.
      - ./edge-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - demographic-service
      - characteristic-service
      - reuse-service
      - vocazione-service
      - notification-service
      - round-service
      - ju-backend
      - janus-dashboard-ui
    networks:
      - janus-net
    restart: unless-stopped

  demographic-service:
    build:
      context: ./services/demographic-service
      dockerfile: Dockerfile
    # No published ports: reachable only through the gateway (ADR-0002).
    environment:
      # Shared DB (ADR-0001); lazily connected, so /health and /demographics/ping
      # answer even before it is reachable. The fallback below is the SAME local
      # value as .env.example, so a no-.env first boot already serves real reads;
      # a real .env (or the Supabase pooler URL) overrides it.
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://janus:CHANGE_ME@ju-postgres:5432/janus}"
      # Dev JWT verification: lets the documented reachability smoke mint a
      # demographics:read token the service verifies, so /demographics/ping returns
      # 200 through the gateway without seeding the database. The monolith issues
      # real tokens in staging/prod; this HS256 key is local-only, not a secret.
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_VERIFICATION_KEY: "${JWT_VERIFICATION_KEY:-CHANGE_ME}"
    depends_on:
      ju-postgres:
        condition: service_healthy
      demographic-schema-init:
        condition: service_completed_successfully
    networks:
      - janus-net
    restart: unless-stopped

  # One-shot: ensures the demographic widget's *schema* exists (empty table),
  # applied on every bring-up. Idempotent (CREATE TABLE IF NOT EXISTS) and loads
  # NO data — the table is seeded separately (manual step, see the service's
  # db/README). Kept out of the service runtime on purpose: the
  # demographic-service stays a pure reader (ADR-0001), so the schema for its
  # data comes up with the compose, not from the app. Reuses the postgres image
  # already pulled for ju-postgres, so no extra download.
  demographic-schema-init:
    image: postgis/postgis:17-3.5
    depends_on:
      ju-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    entrypoint: ["psql"]
    command:
      - "-h"
      - "ju-postgres"
      - "-U"
      - "${POSTGRES_USER:-janus}"
      - "-d"
      - "${POSTGRES_DB:-janus}"
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-f"
      - "/schema/demographic-schema.sql"
    volumes:
      - ./services/demographic-service/db/demographic-schema.sql:/schema/demographic-schema.sql:ro
    networks:
      - janus-net
    restart: "no"

  characteristic-service:
    build:
      context: ./services/characteristic-service
      dockerfile: Dockerfile
    # No published ports: reachable only through the gateway (ADR-0002).
    environment:
      # Shared DB (ADR-0001); lazily connected, so /health and /characteristic/ping
      # answer even before it is reachable. The fallback below is the SAME local
      # value as .env.example, so a no-.env first boot already works; a real .env
      # (or the Supabase pooler URL) overrides it. This service issues DML against
      # its building_* tables — the characteristic-schema-init one-shot grants the
      # janus role the needed INSERT/UPDATE/DELETE.
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://janus:CHANGE_ME@ju-postgres:5432/janus}"
      # Dev JWT verification: lets the documented reachability smoke mint a token
      # the service verifies, so /characteristic/ping returns 200 through the
      # gateway. The monolith issues real tokens in staging/prod; this HS256 key is
      # local-only, not a secret.
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_VERIFICATION_KEY: "${JWT_VERIFICATION_KEY:-CHANGE_ME}"
    depends_on:
      ju-postgres:
        condition: service_healthy
      characteristic-schema-init:
        condition: service_completed_successfully
    networks:
      - janus-net
    restart: unless-stopped

  # One-shot: ensures the characteristic widget's *schema* exists (the three empty
  # building_* tables) AND grants the service's DB role INSERT/UPDATE/DELETE on
  # them — unlike the read-only demographic service, this one issues DML. Applied
  # on every bring-up, idempotent (CREATE TABLE IF NOT EXISTS; grants re-asserted),
  # loads NO data. Kept out of the service runtime on purpose: the schema comes up
  # with the compose, not from the app. Reuses the postgres image already pulled
  # for ju-postgres, so no extra download.
  characteristic-schema-init:
    image: postgis/postgis:17-3.5
    depends_on:
      ju-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    entrypoint: ["psql"]
    command:
      - "-h"
      - "ju-postgres"
      - "-U"
      - "${POSTGRES_USER:-janus}"
      - "-d"
      - "${POSTGRES_DB:-janus}"
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-v"
      - "service_role=${POSTGRES_USER:-janus}"
      - "-f"
      - "/schema/characteristic-schema.sql"
    volumes:
      - ./services/characteristic-service/db/characteristic-schema.sql:/schema/characteristic-schema.sql:ro
    networks:
      - janus-net
    restart: "no"

  reuse-service:
    build:
      context: ./services/reuse-service
      dockerfile: Dockerfile
    # No published ports: reachable only through the gateway (ADR-0002).
    environment:
      # Shared DB (ADR-0001); lazily connected, so /health and /reuse/widget.js
      # answer even before it is reachable. The fallback below is the SAME local
      # value as .env.example, so a no-.env first boot already works; a real .env
      # (or the Supabase pooler URL) overrides it. Unlike the characteristic
      # service, this one needs NO schema-init one-shot: it best-effort ensures its
      # own public.building_workshop registry on boot (src/config/workshop_registry.py),
      # then self-registers in the shared "Add widget" catalog.
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://janus:CHANGE_ME@ju-postgres:5432/janus}"
      # Dev JWT verification: lets the documented reachability smoke mint a token
      # the service verifies, so /reuse/benes returns 200 through the gateway. The
      # monolith issues real tokens in staging/prod; this HS256 key is local-only,
      # not a secret.
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_VERIFICATION_KEY: "${JWT_VERIFICATION_KEY:-CHANGE_ME}"
    depends_on:
      ju-postgres:
        condition: service_healthy
    networks:
      - janus-net
    restart: unless-stopped

  vocazione-service:
    build:
      context: ./services/vocazione-service
      dockerfile: Dockerfile
    # No published ports: reachable only through the gateway (ADR-0002).
    environment:
      # Shared DB (ADR-0001); lazily connected, so /health and /vocazione/widget.js
      # answer even before it is reachable. The fallback below is the SAME local
      # value as the siblings, so a no-.env first boot already works; a real .env
      # (or the Supabase pooler URL) overrides it. The DB is used ONLY for the
      # best-effort catalog self-registration — this Widget owns no tables and has
      # no data route, so there is NO JWT config here (it verifies nothing).
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://janus:CHANGE_ME@ju-postgres:5432/janus}"
    depends_on:
      ju-postgres:
        condition: service_healthy
    networks:
      - janus-net
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    # No published ports: reachable only through the gateway (ADR-0002). The
    # gateway already passes WebSocket upgrades through on every proxied route, so
    # the later authenticated-WS slice needs no compose/Caddyfile change.
    environment:
      # Shared DB (ADR-0001); lazily connected, so /health and
      # /notifications/widget.js answer even before it is reachable. The fallback
      # below is the SAME local value as the siblings, so a no-.env first boot
      # already works; a real .env (or the Supabase pooler URL) overrides it. The
      # DB is used ONLY for the best-effort catalog self-registration — this
      # Widget owns no tables and has no data route.
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://janus:CHANGE_ME@ju-postgres:5432/janus}"
      # WS-handshake auth (slice 3, ADR-0002): the WebSocket endpoint verifies the
      # monolith JWT, so this service needs the SAME verification key + algorithm
      # the monolith signs with — identical to the sibling Widgets. Without it every
      # handshake is refused (the RS256/empty-key default cannot verify the
      # monolith's HS256 token), so no overlay ever stays connected and a publish's
      # `delivered` count is always 0.
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_VERIFICATION_KEY: "${JWT_VERIFICATION_KEY:-CHANGE_ME}"
    depends_on:
      ju-postgres:
        condition: service_healthy
    networks:
      - janus-net
    restart: unless-stopped

  round-service:
    build:
      context: ./services/round-service
      dockerfile: Dockerfile
    # No published ports: reachable only through the gateway (ADR-0002). The
    # gateway already passes WebSocket upgrades through on every proxied route, so
    # the later authenticated per-Bene WS slice needs no compose/Caddyfile change.
    environment:
      # Shared DB (ADR-0001); lazily connected, so /health and /rounds/widget.js
      # answer even before it is reachable. The fallback below is the SAME local
      # value as the siblings, so a no-.env first boot already works; a real .env
      # (or the Supabase pooler URL) overrides it. The recap persists each closed
      # Round's outcome to public.round_outcomes (best-effort DML); the table+grant
      # come up with the round-schema-init one-shot below, never from the app.
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://janus:CHANGE_ME@ju-postgres:5432/janus}"
      # Dev JWT verification: lets the documented reachability smoke mint a token
      # the service verifies, so /rounds/ping returns 200 through the gateway. The
      # monolith issues real tokens in staging/prod; this HS256 key is local-only,
      # not a secret.
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_VERIFICATION_KEY: "${JWT_VERIFICATION_KEY:-CHANGE_ME}"
    depends_on:
      ju-postgres:
        condition: service_healthy
      round-schema-init:
        condition: service_completed_successfully
    networks:
      - janus-net
    restart: unless-stopped

  # One-shot: ensures the Round Manager's durable record exists (the empty
  # round_outcomes table) AND grants the service's DB role INSERT/UPDATE/SELECT on
  # it — the recap writes the closed Round's outcome. Applied on every bring-up,
  # idempotent (CREATE TABLE IF NOT EXISTS; grant re-asserted), loads NO data. Kept
  # out of the service runtime on purpose (schema comes up with the compose, not
  # the app). Reuses the postgres image already pulled for ju-postgres.
  round-schema-init:
    image: postgis/postgis:17-3.5
    depends_on:
      ju-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    entrypoint: ["psql"]
    command:
      - "-h"
      - "ju-postgres"
      - "-U"
      - "${POSTGRES_USER:-janus}"
      - "-d"
      - "${POSTGRES_DB:-janus}"
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-v"
      - "service_role=${POSTGRES_USER:-janus}"
      - "-f"
      - "/schema/round-schema.sql"
    volumes:
      - ./services/round-service/db/round-schema.sql:/schema/round-schema.sql:ro
    networks:
      - janus-net
    restart: "no"

  ju-backend:
    build:
      context: ./monolith/backend
      dockerfile: Dockerfile.dev
    # No published ports: the monolith backend is the gateway's catch-all upstream,
    # reachable only server-to-server.
    volumes:
      # Dockerfile.dev mounts src rather than copying it — read-WRITE, matching the
      # monolith's own dev compose (./src:/app/src, no :ro). The monolith's euklid
      # module configures logging at import and creates src/routers/euklid/agent/
      # logs/, so a read-only mount crashes it (OSError 30). This changes only the
      # orchestration, not any monolith file; those runtime logs are git-ignored.
      - ./monolith/backend/src:/app/src
    environment:
      # The monolith's own config (its code stays byte-for-byte the same). A real
      # root .env — or the host environment — overrides every value; the fallbacks
      # below are the SAME local-dev defaults as .env.example, so `docker compose
      # up` with NO .env boots identically to `cp .env.example .env && up`, and the
      # JWT secret matches the widget's so auth works end-to-end on first run.
      # ⚠️ Local defaults only — insecure; replace for staging/prod.
      - POSTGRESQL_URI=${POSTGRESQL_URI:-postgresql+psycopg://janus:CHANGE_ME@ju-postgres:5432/janus}
      - MONGODB_URI=${MONGODB_URI:-mongodb://ju-mongodb:27017}
      - MONGODB_DB=${MONGODB_DB:-janus}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-sk-local-dev-unused}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-CHANGE_ME}
      - JWT_VERIFICATION_KEY=${JWT_VERIFICATION_KEY:-CHANGE_ME}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    depends_on:
      ju-postgres:
        condition: service_healthy
      ju-mongodb:
        condition: service_started
    networks:
      - janus-net
    restart: unless-stopped

  janus-dashboard-ui:
    build:
      context: ./monolith/frontend
      dockerfile: Dockerfile.dev
    # No published ports: the Next frontend is served to browsers through the
    # gateway at / (single origin), never directly.
    environment:
      - NODE_ENV=development
      - PORT=3000
      # The browser's single origin is the gateway (ADR-0002, Module 5): the Next
      # app resolves every relative path against this base URL, so framework calls
      # (/dashboards, /auth) and Widget calls (/demographics) all flow through the
      # one front door — never at the backend directly. NEXT_PUBLIC_* is inlined at
      # build, so this is a per-environment value (staging/prod inject their own
      # gateway origin), not one image reused everywhere.
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080}
      - NEXT_PUBLIC_GRAPHQL_ENDPOINT=${NEXT_PUBLIC_GRAPHQL_ENDPOINT:-https://il-tuo-endpoint/graphql}
      - NEXT_PUBLIC_THESIS_API_URL=${NEXT_PUBLIC_THESIS_API_URL:-https://il-tuo-thesis-api-url}
    volumes:
      # Mirror the frontend's own dev compose: project mounted for hot-reload,
      # with node_modules kept in a container-managed volume. (.next/ and
      # node_modules/ are git-ignored, so a run never dirties the monolith repo.)
      - ./monolith/frontend:/app:cached
      - ui-node-modules:/app/node_modules
    command: sh -c "npm run dev -- --hostname 0.0.0.0 --port 3000"
    networks:
      - janus-net
    restart: unless-stopped

  # ---- Local data layer (added for the fully-local bring-up) ----
  # NOT part of the strangler-fig contract: the monolith stays byte-for-byte the
  # same and simply points POSTGRESQL_URI / MONGODB_URI at these services. To move
  # to the shared Supabase/Atlas (ADR-0001), edit only the URIs in .env and drop
  # the depends_on — no code changes anywhere.
  ju-postgres:
    # PostGIS superset of postgres:17 so the Supabase dump (pg_dump -Fc, PG17)
    # restores even if it references spatial types. The widget does no geometry.
    image: postgis/postgis:17-3.5
    # Published only to localhost (not the LAN) for DB clients like DBeaver/psql.
    # Internal stack traffic still uses the service name ju-postgres on janus-net.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-janus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-janus}
    volumes:
      - ju-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-janus} -d ${POSTGRES_DB:-janus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - janus-net
    restart: unless-stopped

  ju-mongodb:
    # No auth locally: the monolith only needs MONGODB_URI to connect, which keeps
    # the connection string trivial. Add MONGO_INITDB_ROOT_* + creds for prod.
    image: mongo:7
    volumes:
      - ju-mongodb-data:/data/db
    networks:
      - janus-net
    restart: unless-stopped

volumes:
  ui-node-modules:
    driver: local
  ju-postgres-data:
    driver: local
  ju-mongodb-data:
    driver: local
