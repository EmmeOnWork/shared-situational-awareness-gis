name: demographic-service-dev

services:
  demographic-service-dev:
    image: praim/demographic-service-dev:dev
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: demographic-service-dev
    ports:
      - "28001:28001"
    volumes:
      - ./src:/app/src
    command:
      ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "28001", "--reload"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:28001/health')\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
